# Lab members, in the same order as the original Wix page.
# group: "current" vs "alumni" is a best guess from the original ordering -> Margaret to confirm.
- name: "Dr. Margaret Frank"
  role: "Principal Investigator"
  group: current
  photo: "images/people/dr-margaret-frank.jpg"
  bio:
    - "Margaret is a molecular plant biologist who is broadly interested in understanding how multicellular organisms communicate across tissues and organ systems, and applying this knowledge towards sustainable crop production. Margaret joined Cornell's School of Integrative Plant Science ([SIPS](https://sips.cals.cornell.edu/)) in July 2018. Prior to moving to Cornell, Margaret was an NSF PGRP Postdoctoral Fellow at the Donald Danforth Plant Science Center in St Louis, MO, where she studied the dynamics of graft junction formation and graft-transmissible RNA movement."
    - "Margaret earned her PhD at Cornell, working with [Mike Scanlon](http://scanlonlab.plantbio.cornell.edu/) on the evolution of shoot meristem patterning in early land plant lineages."
    - "When she's not doing science, Margaret loves to run, travel, and drink coffee."
- name: "Michelle Heeney"
  role: "Ph.D. Candidate"
  group: current
  photo: "images/people/michelle-heeney.jpg"
  bio:
    - "Michelle is a PhD student in the Frank Lab and the [Roeder Lab](https://roeder.wicmb.cornell.edu/). She works on dissecting the underpinnings controlling and influencing long distance mRNA movement. Michelle graduated from the University of Massachusetts with two B.S.' one in biology and one in math with a concentration in statistics. Her undergraduate thesis work focused on floral morphology in grasses, under the guidance of [Dr. Madelaine Bartlett](http://www.bartlettlab.org/)."
    - "Michelle also worked in the biotech industry at the startup company [Inari Agriculture](https://inari.com/) where she developed her skills of plant transformation and bioinformatics."
    - "Outside of the lab Michelle has a passion for film photography and fine art."
- name: "Zachary Joseph Ruwitch"
  role: "Undergraduate Researcher"
  group: current
  photo: "images/people/zachary-joseph-ruwitch.jpg"
  bio:
    - "Zachary is an undergraduate researcher in the Frank Lab, working under the mentorship of Sam Yanders. He is majoring in Plant Sciences with a concentration in Integrative Genomics and Molecular Biology, and also conducts research in the Mazourek Lab at Cornell University. His academic interests center on plant genetics, molecular biology, and the role of agriculture in sustainable development."
    - "Outside of the lab, Zach enjoys camping, canoeing, and rock climbing. He’s also a big St. Louis Cardinals and Blues fan."
- name: "Elise Boisvert"
  role: "Ph.D. Candidate"
  group: current
  photo: "images/people/elise-boisvert.jpg"
  bio:
    - "Elise is a PhD student in the Frank lab where she works to shine light on the inner workings of grafted plants. She studies what is happening on a cellular and molecular level as the plant works to heal and join together. Elise started in the Frank lab during her undergraduate at Cornell. Her undergraduate work included a focus in rootstocks and root architecture, and in heterografting solanaceous plants to track mRNA movement."
    - "Outside of the lab, Elise enjoys kayaking, hiking, and hanging out with her cute dogs."
- name: "Jessica Morgan"
  role: "Post-Doctoral Researcher"
  group: current
  photo: "images/people/jessica-morgan.jpg"
  bio:
    - "More to come!"
- name: "Tian Gong"
  role: "Post-Doctoral Researcher"
  group: current
  photo: "images/people/tian-gong.jpg"
  bio:
    - "Tian is a post-doctoral researcher in the Frank lab. She’s working on grafted tomato production under high tunnel conditions."
    - "Tian got her Ph.D. in Horticultural Sciences from the University of Florida."
    - "Tian is known to enjoy exploring Ithaca and eating Cornell dairy ice cream in her free time!"
- name: "Noor AlBader"
  role: "Post-Doctoral Researcher"
  group: current
  photo: "images/people/noor-albader.jpg"
  bio:
    - "Noor broadly studies the transcriptional response to abiotic and biotic stressors in plants. Her work has encompassed staple crops such as rice, to novelty organisms such as chia and the beaver. Her genomic work has also led her to work on date palm and wild relatives of rice, with a focus on adaptation to desert and costal regions, respectively, at the Center of Desert Agriculture (KAUST).\n\nShe completed her PhD (2019) in the Molecular and Cellular Biology Program at Oregon State University (OSU). She is now a post-doctoral researcher, co-hosted by the Frank and [Nelson](https://btiscience.org/andrew-nelson/) labs."
- name: "Tin Aye"
  role: "Undergraduate Researcher"
  group: current
  photo: "images/people/tin-aye.jpg"
  bio:
    - "coming soon!"
- name: "Sam Yanders"
  role: "Ph.D. Student"
  group: current
  photo: "images/people/sam-yanders.jpg"
  bio:
    - "Sam is a PhD student in the Frank lab where she studies the mechanisms that regulate graft compatibility. She received her B.S. in Plant Sciences with emphases in Biology, Horticulture, and Crop Sciences from the University of Missouri. Her undergraduate research focused on the characterization of genes related to ATP stress signaling in the lab of Dr. Gary Stacey, as well as teaching undergraduate courses under the guidance of Dr. Mary Ann Gowdy.\n\nIn her free time, Sam enjoys kayaking, cooking, playing video games, spending time with friends, and making her dog wear funny clothes."
- name: "Israel Gabay"
  role: "Post-Doctoral Researcher"
  group: current
  photo: "images/people/israel-gabay.jpg"
  bio:
    - "Israel is a postdoc investigating the coupling of hydromechanical and electrophysiological processes in mediating long-distance signals in crops. His research aims to enhance our understanding of the inner communication system in plants and leverage this knowledge to guide crop improvement and plant bioengineering.\n\nIsrael holds a Ph.D. in mechanical engineering from the Technion - Israel Institute of Technology. He is hosted by the Frank and Stroock labs and supported by the Fulbright Fellowship.\n\nIn his free time, Israel enjoys spending time with friends and family and playing soccer."
- name: "Antone Jung"
  role: "Undergraduate Researcher"
  group: current
  photo: "images/people/antone-jung.jpg"
  bio:
    - "Antone is mentored by graduate student Michelle Heeney and works jointly between the Frank lab and the lab of Dr. Adrienne Roeder."
- name: "Xing Ma"
  role: "Laboratory Technician"
  group: current
  photo: "images/people/xing-ma.jpg"
  bio:
    - "Xing is a plant pathologist who pinpointed Dickeya dianthicola as the source of potato blackleg and soft rot outbreaks after 2014 in the Northeast US. His work also identified the potential of wild species Solanum microdontum to build better disease resistance into potato crops.\n\nWith a PhD from THE OSU and a decade of research experience at Cornell, Xing has deep expertise in pathogen genomics and bioinformatics. When he’s off the clock, you’ll likely find him researching computer parts for his next PC build, playing video games, or catching up on music."
- name: "Henry Sun"
  role: "Undergraduate Researcher"
  group: current
  photo: "images/people/henry-sun.jpg"
  bio:
    - "more coming soon!"
- name: "Emma Nam"
  role: "Undergraduate Researcher"
  group: current
  photo: "images/people/emma-nam.jpg"
  bio:
    - "Emma is an undergraduate researcher in the Frank Lab working under the mentorship of Israel Gabay. As a Chemical Engineering student, she is passionate about understanding how plants communicate and respond to their environment, with broader interests in sustainable agriculture and engineering approaches to biology. Outside the lab, Emma is a member of the Cornell Cheerleading Team and enjoys expressing her creativity through sewing, baking, and growing her collection of Smiskis. In her free time, she loves staying active through running and spending time outdoors."
- name: "Lucia Gore"
  role: "Undergraduate Researcher"
  group: current
  photo: "images/people/lucia-gore.jpg"
  bio:
    - "Lucia just finished her freshman year at Cornell as a plant science major, hoping to minor in nutrition. Her academic interests include plant genetics, nutrition, food science, and community outreach/engagement.\n\nOutside of the lab, she enjoys running, boxing, painting, and drawing, and engaging with the community."
- name: "Guinevere Goldberg"
  role: "Scientist in training"
  group: current
  photo: "images/people/guinevere-goldberg.jpg"
  bio:
    - "Gwenny joined the lab in November 2019. Since then she has provided her expertise in tomato taste-testing. She can be found joining Margaret in meetings, stomping in puddles, or enjoying school."
- name: "Annabel and Graham"
  role: "Scientists in training"
  group: current
  photo: "images/people/annabel-and-graham.jpg"
  bio:
    - "Annabel and Graham joined the lab in June 2024. They are preparing for fruitful careers in field research"
